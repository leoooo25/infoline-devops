name: Angular CI

# Se déclenche à chaque push sur la branche main
on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Étape 1 : télécharger le code
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Étape 2 : installer Node.js 20
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/angular-app/package-lock.json

      # Étape 3 : installer les dépendances
      - name: Installer les dépendances
        run: npm ci
        working-directory: frontend/angular-app

      # Étape 4 : lancer les tests
      - name: Lancer les tests
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadless
        working-directory: frontend/angular-app

      # Étape 5 : compiler l'application
      - name: Compiler l'application
        run: npx ng build
        working-directory: frontend/angular-app
