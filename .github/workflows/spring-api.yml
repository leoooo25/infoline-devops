name: Spring Boot CI/CD

# Se déclenche à chaque push sur la branche main
on:
  push:
    branches: [ main ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : télécharger le code du repo
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Étape 2 : installer Java 21 sur la machine GitHub
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Étape 3 : compiler ET lancer les tests
      - name: Compiler et tester
        run: mvn clean test
        working-directory: api/springboot-api

      # Étape 4 : créer le fichier JAR (sans relancer les tests)
      - name: Créer le JAR
        run: mvn package -DskipTests
        working-directory: api/springboot-api

      # Étape 5 : se connecter à Docker Hub avec les secrets GitHub
      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Étape 6 : construire l'image Docker
      - name: Construire l'image Docker
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/infoline-api:latest api/springboot-api

      # Étape 7 : pousser l'image sur Docker Hub
      - name: Pousser l'image sur Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/infoline-api:latest
