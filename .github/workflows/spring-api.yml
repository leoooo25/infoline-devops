# spring-api.yml — build/test l'API Spring Boot, push l'image, redéploie sur Minikube
name: Spring Boot CI/CD

# Se déclenche à chaque push sur la branche main
on:
  push:
    branches: [ main ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Étape 1 : télécharger le code du repo
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Étape 2 : installer Java 21 sur la machine GitHub
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Étape 3 : compiler ET lancer les tests
      - name: Compiler et tester
        run: mvn clean test
        working-directory: api/springboot-api

      # Étape 4 : créer le fichier JAR (sans relancer les tests)
      - name: Créer le JAR
        run: mvn package -DskipTests
        working-directory: api/springboot-api

      # Étape 5 : se connecter à Docker Hub avec les secrets GitHub
      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Étape 6 : construire l'image Docker
      - name: Construire l'image Docker
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/infoline-api:latest api/springboot-api

      # Étape 7 : pousser l'image sur Docker Hub
      - name: Pousser l'image sur Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/infoline-api:latest

  deploy:
    needs: build-test-push
    runs-on: self-hosted
    steps:
      # Étape 8 : redéployer automatiquement sur le cluster juste après le push de l'image
      # --context minikube : obligatoire, le runner tourne sur la même machine que le
      # runner Darija qui bascule le contexte kubectl par défaut sur k3s
      - name: Redéployer sur Kubernetes
        run: |
          kubectl --context minikube rollout restart deployment/infoline-api
          kubectl --context minikube rollout status deployment/infoline-api
